<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Дневник</title>
<meta name="theme-color" content="#f6f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дневник">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#f6f5f2;color:#1a1a17;font-family:'Golos Text',-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:inherit}
.top{position:sticky;top:0;z-index:50;background:rgba(246,245,242,0.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid #e8e7e2;padding:14px 16px 10px;padding-top:calc(14px + env(safe-area-inset-top))}
.row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:800;letter-spacing:0.34em;font-size:13px;color:#1a1a17;padding-left:2px}
.icb{background:#fff;color:#1a1a17;border:1px solid #e8e7e2;border-radius:10px;width:36px;height:36px;font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s ease,background .15s ease}
.icb:active{transform:scale(.94);background:#f1f0ec}
.row2{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11.5px;color:#9d9c97;letter-spacing:0.02em}
.row2 #saveState{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:#9d9c97;font-size:11px;font-weight:500}
#saveState .sd{width:6px;height:6px;border-radius:50%;background:#16a34a;display:inline-block;transition:background .2s}
#saveState.saving .sd{background:#f59e0b}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:999px;border:1px solid #e8e7e2;background:#fff;color:#595955;font-weight:600;font-size:13.5px;white-space:nowrap;transition:all .18s ease}
.tab:active{transform:scale(.96)}
.tab.on{background:#1a1a17;color:#fff;border-color:#1a1a17;box-shadow:0 2px 8px rgba(20,20,15,0.18)}
.tab.add{font-size:16px;padding:7px 12px;border-style:dashed;color:#9d9c97;background:transparent}
#view{max-width:640px;margin:0 auto;padding:16px 16px 150px}
.card{background:#fff;border:1px solid #e8e7e2;border-radius:14px;margin-bottom:10px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.pad{padding:14px 16px}
.day.open{border-color:#d6d4ce;box-shadow:0 6px 22px rgba(20,20,15,0.08)}
.drow{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:none;border:0;text-align:left;font-size:15px;color:#1a1a17;font-family:inherit}
.chev{color:#9d9c97;font-size:11px;transition:transform .25s cubic-bezier(.4,0,.2,1);flex:none;display:inline-block}
.chev.up{transform:rotate(90deg)}
.ddate{font-weight:600;font-size:16px;letter-spacing:-0.01em}
.dwd{color:#9d9c97;font-size:12px;letter-spacing:0.04em}
.dtitle{color:#595955;font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.dot{width:6px;height:6px;border-radius:50%;background:#1a1a17;flex:none}
.dbody{padding:0 16px 16px;border-top:1px solid #e8e7e2}
.dbar{display:flex;gap:8px;margin:12px 0 14px}
.mini{border:1px solid #e8e7e2;background:#fff;border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:500;color:#595955;display:inline-flex;align-items:center;gap:5px;transition:transform .15s,background .15s}
.mini:active{transform:scale(.96);background:#f1f0ec}
.mini.danger{color:#b91c1c;border-color:#fecaca;background:#fef2f2}
.titleinp{width:100%;border:0;border-bottom:1px solid #e8e7e2;padding:8px 0 10px;font-size:18px;font-weight:600;margin-bottom:6px;outline:none;background:none;color:#1a1a17;font-family:inherit;letter-spacing:-0.01em}
.titleinp::placeholder{color:#9d9c97;font-weight:400}
.editor{min-height:160px;font-family:'Spectral',Georgia,serif;font-size:16.5px;line-height:1.65;outline:none;padding:6px 0 10px;word-break:break-word;color:#1a1a17}
.editor.big{min-height:280px}
.editor h2{font-size:21px;margin:.5em 0 .3em;letter-spacing:-0.01em;font-weight:600}
.editor ul{padding-left:22px;margin:.3em 0}
.editor ul li{margin:.15em 0}
.editor [data-ph]:empty::before{content:attr(data-ph);color:#9d9c97;font-style:italic}
mark{color:inherit;padding:1px 2px;border-radius:3px}
.mk1{background:#fde68a}.mk2{background:#bbf7d0}.mk3{background:#bfdbfe}.mk4{background:#fbcfe8}
.empty{border:1.5px dashed #d6d4ce;border-radius:14px;padding:32px 20px;text-align:center;color:#9d9c97;font-size:14px;line-height:1.55;margin-bottom:12px;background:#fff}
.bigbtn{display:block;width:100%;margin-top:14px;padding:14px;background:#1a1a17;color:#fff;border:0;border-radius:14px;font-size:14.5px;font-weight:600;text-align:center;letter-spacing:0.01em;transition:transform .15s ease;box-shadow:0 2px 8px rgba(20,20,15,0.12)}
.bigbtn:active{transform:scale(.98)}
.bigbtn.ghost2{background:#fff;color:#1a1a17;border:1px solid #e8e7e2;box-shadow:none;margin-top:8px}
.prow{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #e8e7e2}
.pdate{font-weight:600;font-size:15px;flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-0.01em}
.chipc{background:#1a1a17;color:#fff;font-size:10.5px;font-weight:600;border-radius:999px;padding:2px 8px;letter-spacing:0.04em;text-transform:lowercase}
.pcount{color:#9d9c97;font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:500}
.pitems{padding:6px 16px 12px}
.pitem{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #e8e7e2}
.pitem:last-of-type{border-bottom:none}
.cb{width:22px;height:22px;border-radius:50%;border:1.5px solid #d6d4ce;background:#fff;color:#fff;font-size:11px;line-height:1;flex:none;display:inline-flex;align-items:center;justify-content:center;transition:all .18s ease}
.pitem.done .cb{background:#1a1a17;border-color:#1a1a17}
.ptext{flex:1;font-size:15px;line-height:1.4}
.pitem.done .ptext{color:#9d9c97;text-decoration:line-through}
.x{border:0;background:none;color:#9d9c97;font-size:13px;padding:4px 6px;border-radius:6px;transition:color .15s}
.x:active{color:#b91c1c}
.padd{display:flex;gap:8px;margin-top:10px}
.iteminp{flex:1;min-width:0;border:1px solid #e8e7e2;border-radius:10px;padding:10px 13px;font-size:15px;outline:none;background:#fff;transition:border .18s ease}
.iteminp:focus{border-color:#595955}
.iteminp::placeholder{color:#9d9c97}
.tgroups{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid #e8e7e2;background:#fff;color:#1a1a17;font-weight:600;font-size:13px;white-space:nowrap;transition:all .18s ease}
.chip:active{transform:scale(.96)}
.chip.on{background:#1a1a17;color:#fff;border-color:#1a1a17}
.chip.add{font-size:15px;padding:6px 11px;border-style:dashed;color:#9d9c97;background:transparent}
.iconbtn{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid #e8e7e2;background:#fff;font-size:16px;color:#595955;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.iconbtn:active{transform:scale(.94);background:#f1f0ec}
.tbar{display:flex;gap:8px;margin-bottom:12px}
.tbar input[type=search]{flex:1;min-width:0;border:1px solid #e8e7e2;border-radius:10px;padding:10px 14px;font-size:15px;background:#fff;outline:none;-webkit-appearance:none;appearance:none;transition:border .18s ease}
.tbar input[type=search]:focus{border-color:#595955}
.tbar input[type=search]::placeholder{color:#9d9c97}
.ghost{border:1px solid #e8e7e2;background:#fff;border-radius:10px;padding:0 14px;font-weight:600;font-size:13px;color:#595955;height:42px;display:inline-flex;align-items:center;transition:all .15s}
.ghost:active{transform:scale(.96);background:#f1f0ec}
.term{background:#fff;border:1px solid #e8e7e2;border-radius:14px;padding:13px 15px;margin-bottom:8px;transition:border-color .15s}
.trow{display:flex;gap:6px;align-items:center}
.tname{flex:1;font-size:15.5px;font-weight:600;letter-spacing:-0.005em}
.tdef{color:#595955;font-size:14px;line-height:1.55;margin-top:5px;white-space:pre-wrap;word-break:break-word;font-family:'Spectral',Georgia,serif}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:0 4px}
.sechead h2{font-size:22px;flex:1;margin:0;font-weight:700;letter-spacing:-0.015em}
.mask{position:fixed;inset:0;background:rgba(20,20,15,0.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:300;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 20px calc(18px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1);max-height:88vh;overflow:auto;box-shadow:0 -10px 40px rgba(20,20,15,0.18)}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:16px;font-weight:600}
.shead .x{width:30px;height:30px;border-radius:50%;background:#f1f0ec;color:#595955;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.sfoot{display:flex;gap:8px;margin-top:16px}
.sfoot .ghost{flex:1;padding:13px;font-size:15px;font-weight:500;height:auto;justify-content:center}
.prime{flex:1;background:#1a1a17;color:#fff;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:600;transition:transform .15s;box-shadow:0 2px 8px rgba(20,20,15,0.16)}
.prime:active{transform:scale(.98)}
.prime.danger{background:#b91c1c;box-shadow:0 2px 8px rgba(185,28,28,0.2)}
.inp{display:block;width:100%;border:1px solid #e8e7e2;border-radius:12px;padding:12px 14px;font-size:15.5px;margin-bottom:10px;outline:none;background:#fff;color:#1a1a17;transition:border .18s ease}
.inp:focus{border-color:#595955}
.inp::placeholder{color:#9d9c97}
textarea.inp{resize:vertical;min-height:90px;font-family:'Golos Text',sans-serif;line-height:1.5}
.ctext{font-size:14.5px;color:#595955;line-height:1.55;margin:0 0 4px}
.hint{font-size:12.5px;color:#9d9c97;line-height:1.5;margin:12px 0 0}
.linkbtn{display:block;background:none;border:0;color:#9d9c97;text-decoration:underline;font-size:13.5px;padding:14px 0 0;width:100%;text-align:center;text-underline-offset:3px}
.linkbtn.danger{color:#b91c1c}
#tools{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:250;background:#1a1a17;display:none;gap:4px;padding:8px;border-radius:18px 18px 0 0;max-width:640px;width:100%;box-shadow:0 -6px 24px rgba(20,20,15,0.18);overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tools.show{display:flex}
#tools button{flex:none;min-width:40px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,0.08);color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0 8px;font-weight:600;transition:background .15s ease}
#tools button:active{background:rgba(255,255,255,0.15)}
#tools button.on{background:#fff;color:#1a1a17}
.dotc{width:18px;height:18px;border-radius:5px;display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:100px;background:#1a1a17;color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:400;max-width:86vw;text-align:center;box-shadow:0 14px 40px rgba(20,20,15,0.18)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}

/* v8: icon alignment + primary iconbtn */
.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.bigbtn.ghost2{display:flex;align-items:center;justify-content:center;gap:8px}
.x{display:inline-flex;align-items:center;justify-content:center}
.chev{display:inline-flex;align-items:center;justify-content:center}
.chip.add{display:inline-flex;align-items:center;justify-content:center}
.tab.add{display:inline-flex;align-items:center;justify-content:center}
.iconbtn.primary{background:#1a1a17;color:#fff;border-color:#1a1a17}
.iconbtn.primary:active{background:#000;transform:scale(.94)}
.mini svg,.bigbtn svg,.x svg,.cb svg,.icb svg,.chev svg,.chip svg,.iconbtn svg,.tab svg{flex:none;display:block}
</style>
</head>
<body>
<header class="top">
<div class="row1">
<div class="logo">ДНЕВНИК</div>
<button class="icb" id="btnBackup" aria-label="Резервные копии"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
</div>
<div class="row2"><span id="todayLine"></span><span id="saveState" class="ok"><span class="sd"></span><span class="st">Сохранено</span></span></div>
<nav class="tabs" id="tabs"></nav>
</header>
<main id="view"></main>
<div id="tools">
<button data-cmd="bold" aria-label="Жирный"><b>Ж</b></button>
<button data-cmd="italic" aria-label="Курсив"><i>К</i></button>
<button data-cmd="underline" aria-label="Подчёркнутый"><u>Ч</u></button>
<button data-cmd="h" aria-label="Заголовок">H</button>
<button data-cmd="list" aria-label="Список"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg></button>
<button data-cmd="mark" data-mark="mk1" aria-label="Жёлтый маркер"><span class="dotc" style="background:#ffe58a"></span></button>
<button data-cmd="mark" data-mark="mk2" aria-label="Зелёный маркер"><span class="dotc" style="background:#b7ebc6"></span></button>
<button data-cmd="mark" data-mark="mk3" aria-label="Синий маркер"><span class="dotc" style="background:#bcdcff"></span></button>
<button data-cmd="mark" data-mark="mk4" aria-label="Розовый маркер"><span class="dotc" style="background:#ffc9de"></span></button>
<button data-cmd="clear" aria-label="Убрать форматирование">⌫</button>
</div>
<input type="file" id="fileImp" accept=".json,application/json" hidden>
<script>
"use strict";
var VERSION='v8';
var KEY='dnevnik.v2', KEY_BAK='dnevnik.v2.bak', KEY1='dnevnik.v1', LAST_EXP='dnevnik.lastExport', LAST_NAG='dnevnik.lastNag';
var WD=['вс','пн','вт','ср','чт','пт','сб'];
var MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var state=null, modal=null, dlgSeq=0, saveT=null, termQuery='', _refocusPlan=null;
var IC={
  trash:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>',
  edit:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
  more:'<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
  cal:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>',
  x:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>',
  plus:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  chev:'<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  list:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>'
};
function $(s){ return document.querySelector(s); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function validDate(v){ return /^\d{4}-\d{2}-\d{2}$/.test(v||'')?v:null; }
function fmtHuman(iso){ var p=iso.split('-'),y=+p[0],m=+p[1],d=+p[2]; return d+' '+MONTHS[m-1]+(y!==new Date().getFullYear()?' '+y:''); }
function fmtToday(){ var d=new Date(); return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear(); }
function byDate(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; }
function normalize(s){
  s=(s&&typeof s==='object')?s:{};
  var out={
    days:Array.isArray(s.days)?s.days:[],
    plans:Array.isArray(s.plans)?s.plans:[],
    sections:Array.isArray(s.sections)?s.sections:[],
    termGroups:Array.isArray(s.termGroups)?s.termGroups:null,
    termActive:s.termActive||null,
    termSort:s.termSort==='new'?'new':'az',
    active:s.active||'days',
    openDay:s.openDay||null
  };
  if(!out.termGroups){
    var legacy=(Array.isArray(s.terms)?s.terms:[]).filter(function(t){ return t&&t.id; }).map(function(t){
      return {id:String(t.id),term:String(t.term||'').trim(),def:String(t.def||''),created:+t.created||Date.now()};
    });
    out.termGroups=[{id:uid(),name:'Термины',terms:legacy}];
  }
  out.termGroups=out.termGroups.filter(function(g){ return g&&g.id; }).map(function(g){
    return { id:String(g.id), name:String(g.name||'').trim().slice(0,40)||'Без названия',
      terms:(Array.isArray(g.terms)?g.terms:[]).filter(function(t){ return t&&t.id; }).map(function(t){
        return {id:String(t.id),term:String(t.term||'').trim(),def:String(t.def||''),created:+t.created||Date.now()};
      }) };
  });
  if(!out.termGroups.length) out.termGroups=[{id:uid(),name:'Термины',terms:[]}];
  if(!out.termGroups.some(function(g){ return g.id===out.termActive; })) out.termActive=out.termGroups[0].id;
  out.days=out.days.filter(function(d){ return d&&d.id&&validDate(d.date); }).map(function(d){
    return {id:String(d.id),date:d.date,title:String(d.title||''),content:String(d.content||'')};
  });
  out.days.sort(byDate);
  if(!out.days.some(function(d){ return d.id===out.openDay; })) out.openDay=null;
  out.plans=out.plans.filter(function(p){ return p&&p.id&&validDate(p.date); }).map(function(p){
    return { id:String(p.id), date:p.date, created:+p.created||Date.now(),
      items:(Array.isArray(p.items)?p.items:[]).filter(function(i){ return i&&i.id; }).map(function(i){
        return {id:String(i.id),text:String(i.text||''),done:!!i.done};
      }) };
  });
  out.plans.sort(byDate);
  out.sections=out.sections.filter(function(x){ return x&&x.id; }).map(function(x){
    return {id:String(x.id),name:String(x.name||'').trim().slice(0,30)||'Раздел',content:String(x.content||'')};
  });
  if(out.active!=='days'&&out.active!=='terms'&&out.active!=='plans'&&!out.sections.some(function(x){ return x.id===out.active; })) out.active='days';
  return out;
}
function isEmptyState(s){

  var tg=Array.isArray(s.termGroups)?s.termGroups:(Array.isArray(s.terms)?[{terms:s.terms}]:[]);
  var hasTerms=tg.some(function(g){ return g&&g.terms&&g.terms.length; });
  return !((s.days&&s.days.length)||(s.plans&&s.plans.length)||(s.sections&&s.sections.length)||hasTerms);
}

  if(!s||isEmptyState(s)){

    if(bak){ try{ var bs=JSON.parse(bak); if(bs&&!isEmptyState(bs)){ s=bs; setTimeout(function(){ toast('Записи восстановлены из резервной копии'); },800); } }catch(e){} }
  }

    try{ var v1=JSON.parse(localStorage.getItem(KEY1)||'null'); if(v1&&!isEmptyState(normalize(v1))) s=v1; }catch(e){}
  }

function caretEnd(el){
  el.focus();
  var r=document.createRange();
  r.selectNodeContents(el);
  r.collapse(false);
  var s=getSelection();
  s.removeAllRanges();
  s.addRange(r);
}
function unwrapEl(el){
  var p=el.parentNode;
  if(!p) return;
  while(el.firstChild) p.insertBefore(el.firstChild,el);
  p.removeChild(el);
}
function toggleInline(cmd){
  var ed=$('#editor'); if(!ed) return;
  ed.focus();
  var on=false; try{ on=document.queryCommandState(cmd); }catch(e){}
  if(!on){ document.execCommand(cmd,false,null); }
  else{
    var s=getSelection(), n=s.anchorNode, tags={B:1,STRONG:1,I:1,EM:1,U:1};
    while(n&&n!==ed){
      var el=(n.nodeType===1)?n:n.parentElement;
      if(el&&ed.contains(el)&&tags[el.tagName]){ unwrapEl(el); break; }
      n=n.parentNode;
    }
  }
  updateToolStates();
}
function toggleHeading(){
  var ed=$('#editor'); if(!ed) return;
  ed.focus();
  var b=''; try{ b=document.queryCommandValue('formatBlock')||''; }catch(e){}
  document.execCommand('formatBlock',false,/^h[1-6]$/i.test(b)?'p':'h2');
  saveSoon();
  updateToolStates();
}
function applyMark(cls){
  var ed=$('#editor'); if(!ed) return;
  ed.focus();
  var s=getSelection();
  if(!s.rangeCount) return;
  var r=s.getRangeAt(0);
  if(r.collapsed){ toast('Сначала выдели текст'); return; }
  var node=r.startContainer;
  var el=(node.nodeType===1)?node:node.parentElement;
  var m=el?el.closest('mark'):null;
  if(m&&ed.contains(m)){
    if(m.classList.contains(cls)) unwrapEl(m);
    else m.className=cls;
    saveSoon(); updateToolStates(); return;
  }
  var mark=document.createElement('mark');
  mark.className=cls;
  try{ mark.appendChild(r.extractContents()); r.insertNode(mark); }
  catch(e){ document.execCommand('insertHTML',false,'<mark class="'+cls+'">'+esc(r.toString())+'</mark>'); }
  saveSoon();
  updateToolStates();
}
function clearFormatting(){
  var ed=$('#editor'); if(!ed) return;
  ed.focus();
  var s=getSelection();
  var r=s.rangeCount?s.getRangeAt(0):null;
  document.execCommand('removeFormat',false,null);
  if(r){
    ed.querySelectorAll('mark,b,strong,i,em,u').forEach(function(el){
      try{ if(r.intersectsNode(el)) unwrapEl(el); }catch(e){}
    });
  }
  saveSoon();
  updateToolStates();
}
function updateToolStates(){
  var ed=$('#editor'), tools=$('#tools');
  if(!ed||!tools) return;
  var s=getSelection();
  var inside=s.anchorNode&&ed.contains(s.anchorNode);
  tools.querySelectorAll('[data-cmd]').forEach(function(b){
    var c=b.dataset.cmd, on=false;
    try{
      if(c==='bold'||c==='italic'||c==='underline') on=document.queryCommandState(c);
      else if(c==='h') on=/^h[1-6]$/i.test(document.queryCommandValue('formatBlock')||'');
      else if(c==='list') on=document.queryCommandState('insertUnorderedList');
      else if(c==='mark'){
        if(inside){
          var el=(s.anchorNode.nodeType===1)?s.anchorNode:s.anchorNode.parentElement;
          var m=el?el.closest('mark'):null;
          on=!!(m&&ed.contains(m)&&m.classList.contains(b.dataset.mark));
        }
      }
    }catch(e){}
    b.classList.toggle('on',!!on);
  });
}
function placeTools(){
  var t=$('#tools'); if(!t) return;

  if(window.visualViewport){
    var vv=window.visualViewport;

    '<button class="bigbtn ghost2" id="sRen" style="margin-top:0">Переименовать вкладку</button>'
    +'<button class="bigbtn ghost2" id="sDel">Удалить вкладку</button>',
    null,{ok:'Закрыть'});
  $('#sRen').addEventListener('click',function(){
    askText('Название вкладки',s.name,function(v){ s.name=v; persist(); render(); });
  });
  $('#sDel').addEventListener('click',function(){
    confirmDlg('Удалить вкладку?','Вкладка «'+s.name+'» и всё её содержимое будут удалены.',function(){
      state.sections=state.sections.filter(function(x){ return x.id!==s.id; });
      state.active='days';
      persist();
      render(true);
      toast('Вкладка удалена');
    });
  });
}
function onViewClick(e){
  var el=e.target.closest('[data-act]');
  if(!el) return;
  var a=el.dataset.act;
  if(a==='toggle'){
    var card=el.closest('[data-id]');
    syncEditor();
    state.openDay=(state.openDay===card.dataset.id)?null:card.dataset.id;
    persist();
    render(true);
    if(state.openDay===card.dataset.id) setTimeout(focusDay,80);
    return;
  }
  var owner=el.closest('[data-id]');
  var id=owner?owner.dataset.id:null;
  if(a==='newday'){ newDay(); return; }
  if(a==='newplan'){
    askDate('Новый список',todayISO(),function(v){
      var p={id:uid(),date:v,items:[],created:Date.now()};
      state.plans.push(p);
      state.plans.sort(byDate);
      persist();
      render();
    });
    return;
  }
  if(a==='del'){
    var d=state.days.find(function(x){ return x.id===id; });
    if(d) confirmDlg('Удалить день?','Записи за '+fmtHuman(d.date)+' будут удалены навсегда.',function(){ deleteDay(id); });
    return;
  }
  if(a==='date'){
    var d2=state.days.find(function(x){ return x.id===id; });
    if(d2) askDate('Дата дня',d2.date,function(v){
      syncEditor();
      d2.date=v;
      state.days.sort(byDate);
      persist();
      render();
    });
    return;
  }
  if(a==='pdate'){
    var p=state.plans.find(function(x){ return x.id===id; });
    if(p) askDate('Дата списка',p.date,function(v){
      p.date=v;
      state.plans.sort(byDate);
      persist();
      render();
    });
    return;
  }
  if(a==='pdel'){
    var p2=state.plans.find(function(x){ return x.id===id; });
    if(p2) confirmDlg('Удалить список?','Пункты за '+fmtHuman(p2.date)+' будут удалены.',function(){
      state.plans=state.plans.filter(function(x){ return x.id!==id; });
      persist();
      render();
      toast('Список удалён');
    });
    return;
  }
  if(a==='item'){
    var pi=el.closest('[data-item]');
    var pp=state.plans.find(function(x){ return x.id===id; });
    if(pp&&pi){
      var it=pp.items.find(function(x){ return x.id===pi.dataset.item; });
      if(it){ it.done=!it.done; persist(); render(); }
    }
    return;
  }
  if(a==='delitem'){
    var di=el.closest('[data-item]');
    var dp=state.plans.find(function(x){ return x.id===id; });
    if(dp&&di){
      dp.items=dp.items.filter(function(x){ return x.id!==di.dataset.item; });
      persist();
      render();
    }
    return;
  }
  if(a==='additem'){
    var inp=owner.querySelector('.iteminp');
    if(inp) addItemFrom(inp);
    return;
  }
  if(a==='termadd'){ openTermDialog(null); return; }
  if(a==='termsort'){
    state.termSort=(state.termSort==='az')?'new':'az';
    persist();
    render();
    return;
  }
  if(a==='tedit'||a==='tdel'){
    var tid=el.closest('[data-tid]').dataset.tid;
    var g=activeGroup();
    var t=g.terms.find(function(x){ return x.id===tid; });
    if(!t) return;
    if(a==='tedit') openTermDialog(t);
    else confirmDlg('Удалить термин?','«'+t.term+'» будет удалён.',function(){
      g.terms=g.terms.filter(function(x){ return x.id!==tid; });
      persist();
      render();
    });
    return;
  }
  if(a==='tg'){
    state.termActive=el.dataset.tg;
    termQuery='';
    persist();
    render();
    return;
  }
  if(a==='tgadd'){
    askText('Новая группа','',function(v){ addGroup(v); },'Например: Английский');
    return;
  }
  if(a==='tgmore'){ groupMenu(); return; }
  if(a==='secmenu'){ sectionMenu(); return; }
}
function exportBackup(){
  flush();
  try{
    var blob=new Blob([JSON.stringify(state)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='dnevnik-backup-'+todayISO()+'.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },5000);
    localStorage.setItem(LAST_EXP,String(Date.now()));
    toast('Копия сохраняется в «Файлы»');
  }catch(e){ toast('Не получилось скачать копию'); }
}
function onImportFile(e){
  var f=e.target.files[0];
  e.target.value='';
  if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    var obj=null;
    try{ obj=JSON.parse(r.result); }catch(err){ toast('Файл не подходит'); return; }
    var ns=normalize(obj);
    if(isEmptyState(ns)){ toast('В файле нет данных'); return; }
    confirmDlg2('Восстановить копию?','Текущие данные будут заменены данными из файла.',function(){
      state=ns;
      termQuery='';
      persist();
      render(true);
      toast('Данные восстановлены');
    });
  };
  r.readAsText(f);
}
function confirmDlg2(title, text, cb){
  openDialog(title, '<p class="ctext">'+esc(text)+'</p>', function(){ cb(); }, {ok:'Заменить'});
}
function backupSheet(){
  openDialog('Резервные копии',
    '<p class="ctext">Скачай копию и сохрани в надёжное место — «Файлы», облако или заметки. Восстановление заменяет все текущие данные.</p>'
    +'<button class="bigbtn" id="bExp" style="margin-top:10px">Скачать копию</button>'
    +'<button class="bigbtn ghost2" id="bImp">Восстановить из файла</button>'
    +'<button class="linkbtn danger" id="bReset">Сбросить всё</button>',
    null,{ok:'Закрыть'});
  $('#bExp').addEventListener('click',function(){ closeModal(); setTimeout(exportBackup,120); });
  $('#bImp').addEventListener('click',function(){ closeModal(); setTimeout(function(){ $('#fileImp').click(); },120); });
  $('#bReset').addEventListener('click',function(){
    confirmDlg('Сбросить всё?','Будут удалены все дни, планы, термины и вкладки. Это нельзя отменить.',function(){ resetAll(); });
  });
}
function resetAll(){
  try{ localStorage.removeItem(KEY); localStorage.removeItem(KEY_BAK); }catch(e){}
  state=normalize(null);
  termQuery='';
  persist();
  render(true);
  toast('Всё очищено');
}
function maybeBackupReminder(){
  var last=+localStorage.getItem(LAST_EXP)||0;
  var nag=+localStorage.getItem(LAST_NAG)||0;
  if(Date.now()-Math.max(last,nag)<7*864e5) return;
  if(isEmptyState(state)) return;
  localStorage.setItem(LAST_NAG,String(Date.now()));
  setTimeout(function(){
    openDialog('Копия данных',
      '<p class="ctext">Пора сделать резервную копию дневника — на случай, если что-то случится с телефоном или приложением.</p>',
      function(){ exportBackup(); },
      {ok:'Скачать копию'});
  },1500);
}
function installPWA(){
  try{
    var c=document.createElement('canvas');
    c.width=c.height=512;
    var x=c.getContext('2d');
    x.fillStyle='#0b0b0b';
    x.fillRect(0,0,512,512);
    x.fillStyle='#ffffff';
    x.font='800 300px "Golos Text", Arial, sans-serif';
    x.textAlign='center';
    x.textBaseline='middle';
    x.fillText('Д',256,286);
    var url=c.toDataURL('image/png');
    var l=document.createElement('link');
    l.rel='apple-touch-icon';
    l.href=url;
    document.head.appendChild(l);
    var man={name:'Дневник',short_name:'Дневник',start_url:'.',display:'standalone',background_color:'#ffffff',theme_color:'#0b0b0b',icons:[{src:url,sizes:'512x512',type:'image/png'}]};
    var ml=document.createElement('link');
    ml.rel='manifest';
    ml.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/json'}));
    document.head.appendChild(ml);
  }catch(e){}
}
function init(){
  load();
  $('#todayLine').textContent=fmtToday()+' · '+VERSION;
  render(true);
  maybeBackupReminder();
  installPWA();
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
  }
  $('#tabs').addEventListener('click',function(e){
    var b=e.target.closest('[data-tab],#tabAdd');
    if(!b) return;
    if(b.id==='tabAdd'){ newSection(); return; }
    switchTab(b.dataset.tab);
  });
  $('#view').addEventListener('click',onViewClick);
  $('#view').addEventListener('keydown',function(e){
    if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('iteminp')){
      e.preventDefault();
      addItemFrom(e.target);
    }
  });
  $('#view').addEventListener('input',function(e){
    var t=e.target;
    if(t.classList&&t.classList.contains('titleinp')){
      var card=t.closest('[data-id]');
      var d=card&&state.days.find(function(x){ return x.id===card.dataset.id; });
      if(d){ d.title=t.value; saveSoon(); }
    }
  });
  $('#tools').addEventListener('pointerdown',function(e){
    var b=e.target.closest('[data-cmd]');
    if(!b) return;
    e.preventDefault();
    var c=b.dataset.cmd;
    if(c==='mark') applyMark(b.dataset.mark);
    else if(c==='h') toggleHeading();
    else if(c==='list'){
      var ed=$('#editor');
      if(ed){ ed.focus(); document.execCommand('insertUnorderedList',false,null); }
      updateToolStates();
    }
    else if(c==='clear') clearFormatting();
    else toggleInline(c);
    saveSoon();
  });
  $('#btnBackup').addEventListener('click',backupSheet);
  $('#fileImp').addEventListener('change',onImportFile);
  document.addEventListener('selectionchange',function(){
    var ed=$('#editor');
    if(ed&&document.activeElement===ed) updateToolStates();
  });
  if(window.visualViewport){
    visualViewport.addEventListener('resize',placeTools);
    visualViewport.addEventListener('scroll',placeTools);
  }
  window.addEventListener('resize',placeTools);
  window.addEventListener('pagehide',flush);
  window.addEventListener('beforeunload',flush);
  document.addEventListener('visibilitychange',function(){ if(document.hidden) flush(); });
}
init();
</script>
</body>
</html>
